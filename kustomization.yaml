---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: offsite-backups

commonAnnotations:
  repo: https://github.com/charlesthomas/homelab-offsite-backups
labels:
- includeSelectors: true
  pairs:
    app: offsite-backups

resources:
- resources/configmaps.yaml
- resources/cronjobs.yaml
- resources/external-secrets.yaml
- resources/namespaces.yaml
configMapGenerator:
- name: grafana-dashboard-offsite-backups
  files:
  - grafana/offsite-backups.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
